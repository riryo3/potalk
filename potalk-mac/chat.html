<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ひとこと</title><style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--panel,#0d1526);color:var(--text,#e8eefc);font:14px -apple-system,sans-serif}
#log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:6px;align-items:baseline;word-break:break-word}.em{flex:none}.who{flex:none;color:var(--sub,#8fa0c4);max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys{color:var(--sub,#8fa0c4);font-size:12px;justify-content:center}
#past,#now{display:flex;flex-direction:column;gap:6px}#past .r{opacity:.7}
#empty{position:absolute;top:40%;left:0;right:0;text-align:center;color:var(--sub,#8fa0c4);font-size:13px;line-height:1.7;pointer-events:none}
form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border,rgba(255,255,255,.14))}
input{flex:1;min-width:0;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--border,rgba(255,255,255,.2));background:var(--chip,rgba(255,255,255,.08));color:inherit}
a.u{color:var(--accent,#7cb7ff);text-decoration:underline;cursor:pointer;word-break:break-all}
button{font:inherit;color:#fff;background:#3b82f6;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
</style></head><body><div id="log"><div id="past"></div><div id="now"></div></div><div id="empty">まだひとことはありません。<br>下の欄から送れます。</div>
<form id="f"><input id="t" maxlength="60" placeholder="ひとこと…" autocomplete="off"><button>送信</button></form>
<script>
const log=document.getElementById('log'),$p=document.getElementById('past'),$n=document.getElementById('now');
const URL_RE=/(https?:\/\/[^\s<>"'「」]+|www\.[^\s<>"'「」]+)/gi;
function linkify(text){const f=document.createDocumentFragment();let last=0;
 for(const m of text.matchAll(URL_RE)){let u=m[0];const trail=u.match(/[.,;:!?)\]、。，．）]+$/);if(trail)u=u.slice(0,-trail[0].length);
  if(m.index>last)f.append(text.slice(last,m.index));
  const a=document.createElement('a');a.className='u';a.href='#';a.textContent=u;a.title=u;
  const href=/^www\./i.test(u)?'https://'+u:u;a.onclick=e=>{e.preventDefault();pm.openLink(href)};f.append(a);
  last=m.index+u.length}
 if(last<text.length)f.append(text.slice(last));return f}
function add(l){const r=document.createElement('div');r.className='r'+(l.sys?' sys':'');
 const mk=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;return s};
 const tx=mk('tx');tx.append(linkify(l.text));if(l.sys)r.append(tx);else r.append(mk('em',l.em),mk('who',l.who),tx);
 document.getElementById('empty').hidden=true;(l.hist?$p:$n).append(r);log.scrollTop=log.scrollHeight}
const THEME_PROPS=['panel','text','sub','border','chip','chip-hover','accent'];
pm.onTheme(t=>{const r=document.documentElement;for(const k of THEME_PROPS){if(t&&t[k])r.style.setProperty('--'+k,t[k]);else r.style.removeProperty('--'+k)}});
pm.onLine(add);pm.onLines(ls=>{$p.replaceChildren();$n.replaceChildren();document.getElementById('empty').hidden=ls.length>0;ls.forEach(add)});
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=document.getElementById('t');if(t.value.trim()){pm.send(t.value.trim());t.value=''}};
</script></body></html>
