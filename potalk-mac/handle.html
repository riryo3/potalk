<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>部屋一覧の気配</title><style>
html,body{height:100%;margin:0;background:transparent}
body{display:flex;align-items:center;justify-content:center;user-select:none}
#pill{width:3px;height:64px;border-radius:2px;background:var(--sub,#8fa0c4);opacity:.35}
</style></head><body>
<div id="pill"></div>
<script>
const PROPS=['panel','text','sub','border'];
peekPm.onTheme(t=>{const r=document.documentElement;for(const k of PROPS){if(t&&t[k])r.style.setProperty('--'+k,t[k]);else r.style.removeProperty('--'+k)}});
</script></body></html>
